services:
  clipper:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      JOB_DB_PATH: /db/jobs.sqlite
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.1.13:20128/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-hermes-main}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANG: ${WHISPER_LANG:-en}
      WHISPER_BIN: ${WHISPER_BIN:-/usr/local/bin/whisper-cli}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-}
      WHISPER_MODELS_DIR: ${WHISPER_MODELS_DIR:-/models}
    volumes:
      - ./data:/app/data
      - ./models:/models
      - clipper_db:/db
    restart: unless-stopped

volumes:
  clipper_db:
